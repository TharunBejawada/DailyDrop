name: dailydrop_app
description: Hyperlocal grocery + fruits & vegetables delivery app.
publish_to: 'none'
version: 0.1.0
 
environment:
  sdk: '>=3.3.0 <4.0.0'
 
dependencies:
  flutter:
    sdk: flutter
 
  # Backend
  supabase_flutter: ^2.5.6
 
  # State management — chosen for fine-grained rebuilds (performance)
  flutter_riverpod: ^2.5.1
 
  # Images: caching means product photos load instantly after first fetch
  cached_network_image: ^3.3.1
 
  # Formatting prices, dates
  intl: ^0.19.0
 
  # Network awareness — useful given patchy connectivity in small towns
  connectivity_plus: ^6.0.3
 
  # For the later AI product-scan feature (camera capture)
  image_picker: ^1.1.2
 
  # On-device OCR (reads packaging text) + image labeling (recognizes loose
  # produce). Android/iOS only — no web support, see roadmap notes.
  google_mlkit_text_recognition: ^0.13.0
  google_mlkit_image_labeling: ^0.12.0
 
  # Payment collection — Android/iOS only, no web support (see roadmap notes).
  razorpay_flutter: ^1.3.7
 
  cupertino_icons: ^1.0.6
  google_fonts: ^8.2.0
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  shared_preferences: ^2.5.5
 
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
 
flutter:
  uses-material-design: true